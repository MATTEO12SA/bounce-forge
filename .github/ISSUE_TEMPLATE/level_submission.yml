name: Level submission
description: Share a level made with the editor / Partager un niveau créé avec l’éditeur
labels: [level]
body:
  - type: input
    id: name
    attributes:
      label: Level name / Nom du niveau
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Share code / Code de partage
      description: In the game, open Create, then press Share on your level. Paste the code here.
      placeholder: 'BF2:…'
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: The idea behind the level, the intended difficulty…
