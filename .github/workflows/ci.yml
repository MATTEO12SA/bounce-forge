name: CI

# One run per change: pull requests only (pushing to a PR branch re-runs it). `main` is
# validated again by the Pages deploy workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · format · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_BASE_PATH: /bounce-forge/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The browser journey is split into five parts that run side by side, so CI lasts as long as
  # the slowest part instead of the sum of all of them.
  browser:
    name: Browser (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [layout, ui, levels-a, levels-b, gameplay]
    env:
      VITE_BASE_PATH: /bounce-forge/
      BROWSER_PATH: /usr/bin/google-chrome
      SMOKE_SHARD: ${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Browser smoke test (${{ matrix.shard }})
        run: npm run test:smoke

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/smoke
          retention-days: 7
