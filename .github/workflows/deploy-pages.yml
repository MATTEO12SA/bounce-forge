name: Deploy GitHub Pages

# Every push to main is validated, then the exact artifact that passed the checks is deployed.
# To roll back, run this workflow manually with the tag of a previous release (e.g. v1.0.0).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (tag, branch or SHA). Empty = the selected branch.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      BROWSER_PATH: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The full browser journey already ran on the pull request (in parallel parts); before
      # deploying, a quick part checks that the built site boots and plays.
      - name: Browser smoke test (quick part)
        run: npm run test:smoke
        env:
          SMOKE_SHARD: ui

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.run_id }}
          path: artifacts/smoke
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check the live site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url" | grep -q 'Bounce Forge'; then
              echo "Live: $url"
              exit 0
            fi
            sleep 10
          done
          echo "The deployed site did not answer as expected: $url" >&2
          exit 1
