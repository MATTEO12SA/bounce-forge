name: Browser Diagnostics

# Long, focused diagnostics kept for investigations. They run only on demand; the fast,
# portable browser journey (`npm run test:smoke`) runs on every push in CI.
on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'Diagnostic to run'
        required: true
        default: smoke
        type: choice
        options: [smoke, campaign, powerups, walls, ui]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BROWSER_TEST_EDGE_PATH: /usr/bin/google-chrome
      BROWSER_PATH: /usr/bin/google-chrome
      VITE_BASE_PATH: /bounce-forge/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Run ${{ inputs.diagnostic }}
        run: |
          case "${{ inputs.diagnostic }}" in
            smoke) npm run test:smoke ;;
            campaign) npm run test:browser:campaign ;;
            powerups) npm run test:browser:powerups ;;
            walls) npm run test:browser:walls ;;
            ui) npm run test:browser:ui ;;
          esac

      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ inputs.diagnostic }}-${{ github.run_id }}
          path: |
            artifacts/
            *.png
          if-no-files-found: ignore
          retention-days: 7
